<script>
// Level 3 · Grow the land (LOU-289): guided. Storage, grass, meadow, trees and a grove.
// Route: source (1,2) → springs (2,2) (3,2) → (4,2), one step from the bay (5,2).
// Water: 3 → 3 → 3 → 2 with flow 5, so the cycle overfills the 5 gal jar (2 spill) → 5. Then meadow −1, tree −1, two trees −2 → 1,
// and the sea takes the last gallon. No second cycle needed.
// Growing: your meadow on (1,3); ready-made meadows on (2,3) (3,3) (4,3) become the grove, one tap each.
// Map key: T source  . meadow land  _ bare ground  m ready-made meadow  o spring  B mountain  ~ sea
const PATH = [[2, 2], [3, 2], [4, 2]], GROVE = [[3, 3], [4, 3]];
window.MAP = {
  id: "c2-3",
  label: "Level 3 · Grow the land",
  intro: "Storage, meadows, trees and groves",
  guided: true,
  types: [
    "....B...~",
    "........~",
    ".Too.~~~~",
    "._mmm~~~~",
    ".....~~~~",
    "....~~~~~"],
  elev: [
    "111111110",
    "111111110",
    "111110000",
    "111110000",
    "111110000",
    "111100000"],
  storage: 5,
  tileCost: 1,
  stars: [{type: "sea"}, {type: "groves", n: 1}, {type: "storage", n: 6}],
  next: "../4/",
  learned: ["Storage is what your jar holds; the rest spills.", "A meadow stores +1 for each tree beside it.", "Three touching trees make a grove: +1 flow."],
  objectives: [
    {text: g => `Flow <b>3 tiles</b> (${PATH.filter(([x, y]) => g.on(x, y)).length}/3).`, target: g => g.next(PATH), lock: true, move: true, needs: g => g.on(3, 2) ? 1 : 0, done: g => PATH.every(([x, y]) => g.on(x, y))},
    {text: "<b>Tap Next water cycle.</b>", sub: "Watch your jar.", target: "end", lock: true, done: g => g.turn >= 2,
      after: ["rim", g => `Your jar holds ${g.cap} gal. That's <b>storage</b>. Extra water spills.`]},
    {text: g => g.selPlantable ? "<b>Make grass.</b> It's free." : "<b>Tap the ground</b> beside your river.", target: [[1, 3]], lock: true, done: g => g.g(1, 3) >= 1},
    {text: "<b>Grow it into a meadow.</b>", sub: "Meadows hold water beside trees.", target: [[1, 3]], lock: true, needs: 1, done: g => g.g(1, 3) >= 2},
    {text: "<b>Plant trees</b> on the meadow next to it.", target: [[2, 3]], lock: true, needs: 1, done: g => g.g(2, 3) >= 3,
      after: ["rim", g => `+${g.cap - 5} storage. Your jar holds ${g.cap} now.<small>A meadow stores +1 for each tree beside it.</small>`]},
    {text: g => `<b>Plant 2 more trees</b> to make a grove (${g.grown(GROVE, 3)}/2).`, target: g => { const q = GROVE.find(([x, y]) => g.g(x, y) < 3); return q ? [q] : [] }, lock: true, needs: 1, done: g => g.groves >= 1,
      after: ["flow", "Grove: +1 flow."]},
    {text: "Now <b>flow to the sea</b>.", move: true, done: g => g.won}
  ],
  help: []
};
</script>
<script src="../../play.js"></script>
