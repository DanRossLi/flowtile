<body>
<script>
// Level 2 · Read the land (LOU-289): guided. Rock, sand, springs and a mountain's water side.
// Route: source (2,2) → around the rock (3,2) by (2,3) → sand (3,3) → spring (4,3) → (5,3), beside the mountain's pool (6,2) → sea (6,3).
// Water: 3 → 2 (the way round), sand and spring are free, → 1 beside the pool, → 0 into the sea. No water cycle needed.
// Flow: 3 → 2 (sand) → 3 (spring) → 4 (mountain pool).
// Map key: T source  . meadow  r rock  s sand  o spring  B mountain  ~ sea
window.MAP = {
  id: "c2-2",
  label: "Level 2 · Read the land",
  intro: "Rock, sand, springs and mountain pools",
  guided: true,
  types: [
    "..B.....~",
    ".....B..~",
    "..Tr....~",
    "...so.~~~",
    "......~~~",
    ".....~~~~"],
  elev: [
    "111111110",
    "111111110",
    "111111110",
    "111111000",
    "111111000",
    "111110000"],
  waterSides: {"5,1": 5},
  storage: 5,
  tileCost: 1,
  stars: [{type: "sea"}, {type: "springs", n: 1}, {type: "flow", n: 4}],
  next: "../3/",
  nextLabel: "Next level",
  learned: ["Rock costs more; sand is free but drinks flow.", "Springs and mountain pools add flow.", "Your river's width shows its flow."],
  objectives: [
    {text: "Rock costs 2 gal. <b>Go around it.</b>", target: [[2, 3], [3, 2]], allow: [[2, 3]], lock: true, move: true, needs: 1, done: g => g.on(2, 3)},
    {text: "Sand is free. <b>Flow onto it.</b>", target: [[3, 3]], lock: true, move: true, done: g => g.on(3, 3),
      after: ["flow", g => `Sand drinks 1 flow: ${g.income + 1} → ${g.income}<small>Watch the river narrow.</small>`]},
    {text: "Reach the <b>spring</b> for +1 flow.", target: [[4, 3]], lock: true, move: true, done: g => g.on(4, 3),
      after: ["flow", g => `Flow ${g.income - 1} → ${g.income}<small>The river widens.</small>`]},
    {text: "<b>Flow beside the mountain's pool.</b>", sub: "Each mountain has one water side.", target: [[5, 3], [6, 2]], allow: [[5, 3]], lock: true, move: true, needs: 1, done: g => g.runoff >= 1,
      after: ["flow", "+1 flow from the mountain."]},
    {text: "Now <b>flow to the sea</b>.", move: true, done: g => g.won}
  ],
  help: []
};
</script>
<script src="../../play.js"></script>
</body>
