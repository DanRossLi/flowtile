<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<script>
// Level 1 · First river (LOU-289): guided. Water, flow and Next water cycle.
// A straight run: 5 tiles from the source (1,2) to the shore, plus the step into the sea (7,2).
// Water: 3 → 2 → 1 → 0 after three tiles, one cycle → 3, then two tiles and the sea. Finishes on turn 2.
// Map key: T source (3 gal a cycle)  . meadow  B mountain  ~ sea
const PATH = [[3, 2], [4, 2]];
window.MAP = {
  id: "c2-1",
  label: "Level 1 · First river",
  intro: "Water, flow and Next water cycle",
  guided: true,
  types: [
    "..B....~",
    ".......~",
    ".T.....~",
    "....B..~",
    ".......~"],
  elev: [
    "11111110",
    "11111110",
    "11111110",
    "11111110",
    "11111110"],
  storage: 5,
  tileCost: 1,
  stars: [{type: "sea"}, {type: "nwc"}, {type: "byTurn", n: 3}],
  next: "../2/",
  learned: ["Water is what you spend.", "Flow is what you earn each cycle.", "Reach the sea to finish."],
  objectives: [
    {text: "This is your source. <b>Tap it.</b>", target: "source", lock: true, done: g => g.phase === "play"},
    {text: "<b>Tap a ring</b> to flow there.", target: [[2, 2]], lock: true, move: true, needs: 1, done: g => g.on(2, 2),
      after: ["water", "<b class=\"wtr\">Water</b>: what you spend. That cost 1 gal."]},
    {text: g => `Flow <b>2 more tiles</b> (${PATH.filter(([x, y]) => g.on(x, y)).length}/2).`, target: g => g.next(PATH), lock: true, move: true, needs: 1, done: g => PATH.every(([x, y]) => g.on(x, y))},
    {text: "Out of water. <b>Tap Next water cycle.</b>", target: "end", lock: true, done: g => g.turn >= 2,
      after: ["flow", "<b class=\"flw\">Flow</b>: water you get every cycle."]},
    {text: "Now <b>flow to the sea</b>.", move: true, done: g => g.won}
  ],
  help: []
};
</script>
<script src="../../play.js"></script>
</body>
</html>
