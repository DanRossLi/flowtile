  id: "perfection-island",
  label: "Perfection island",
  lesson: "Everything you've learned, all at once. Score as many points as you can before time runs out.",

    "____.__FFF___~",
    "_p___B______.~",

    "11111001111110",
    "11111111111110",
    "11111111111110"],
  mode: "perfection",
  turns: 20,
  scoreStars: [30, 45, 60],
  storage: 5,
  bloomKind: "meadows",
  wind: [-1, 0],
  cycle: true,
  weather: {"5": "rain", "9": "drought", "12": "fire", "16": "rain"},
  snowmelt: true,
  moss: true,
  deer: true,
  tileCost: 1,
  showBloom: true,
  placeSource: true,
  startHint: "Pick a source: the top one gives 3 gal per water cycle, the bottom one 2.",
  pickHint: "Tap one of the two sources on the left.",

  help: [
    "Every rule from the lessons is on. Grow your river, green the land, make groves, collect pools and catch your clouds.",
