<script>
// Tutorial 7 (was Map 1a · Sand): flat meadow with one sand tile near the sea. Sand blooms its neighbours but cuts flow by 1,
// so taking it late is cheap: straight through still reaches the sea on turn 5 with 2 tiles in bloom.
// Map key: . meadow  s sand  r rock  B mountain  o spring  L lake  ~ sea  S source (2 gal/turn)  T source (3 gal/turn)
window.MAP = {
  id: "tut-7-sand",
  label: "Tutorial 7 · Sand",
  tutorial: 7,
  lesson: "<b>Sand</b> is free to cross and blooms the land around it, but each sand tile <b>cuts your flow by 1</b>. Decide when the blooms are worth it.",
  types: [
    "........~",
    "........~",
    "S.....s.~",
    "........~",
    "........~"],
  elev: [
    "111111110",
    "111111110",
    "111111110",
    "111111110",
    "111111110"],
  bloomGoal: 2,
  turnGoal: 4,
  tileCost: 1,
  startHint: "Tap the spring on the left to start.",
  next: "../8/",
  // In-map objectives (LOU-264): one at a time, checked by the game
  objectives: [
    {text: "Tap the spring on the left to start", target: "source", done: g => g.phase !== "pick"},
    {text: "Cross the sand: free, but −1 flow", target: "sand", done: g => g.river("sand") >= 1},
    {text: "Sand bloomed the land. Reach the sea", target: "sea", done: g => g.won}],
  help: ["Tap the spring on the left. Its <b>flow</b> is <b>2 gal</b> per water cycle.", "Tap your stream's <b>end</b>, then a glowing tile to extend it. The number is its cost in gallons. Out of water? Tap <b>Next Water Cycle</b> and your flow refills it.", "The map is flat and every tile costs <b>1 gal</b>. Run the stream <b>left to right</b> to the sea.", "<b>Sand</b> (speckled tiles) is <b>free</b> to cross and <b>blooms</b> every land tile around it, but it soaks up water: your <b>flow drops by 1</b> for the rest of the run. Take it late, when you need less water.", "If your flow hits <b>0</b> you can't collect any more water."]
};
</script>
