<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow Tile · Tutorial</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flow Tile">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#cfe3ea">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="stylesheet" href="../play.css">
</head>
<body>
<script>
// Directed tutorial (LOU-281): land on a small island and learn by doing, one micro goal at a time. The game checks
// every goal; while a goal is locked only its target answers taps. No stars, and you can't lose.
// Map key: T source (3 gal/turn)  _ bare ground  . meadow  r rock  s sand  o spring  B mountain  ~ sea
// Route: source (0,3) → (1,3) (2,3) (3,3) → around the rock (4,3) via (4,2) → sand (5,2) → spring (6,2) → (7,2), beside the
// mountain's runoff pool (7,1) → sea (8,2). Growing: meadow on (1,4), trees on (2,4) (3,4) (4,4).
const PATH = [[2, 3], [3, 3]], GROVE = [[3, 4], [4, 4]], ROW = [[1, 2], [2, 2], [3, 2]];
window.MAP = {
  id: "tutorial",
  label: "Tutorial",
  tutorial: true,
  types: [
    ".......B~",
    "........~",
    ".____so_~",
    "T___r...~",
    ".____...~",
    "........~",
    "........~"],
  elev: [
    "111111110",
    "111111110",
    "111111110",
    "111111110",
    "111111110",
    "111111110",
    "111111110"],
  waterSides: {"7,0": 5},
  storage: 5,
  bloomGoal: 0,
  turnGoal: 99,
  tileCost: 1,
  startHint: "Tap your water source to start.",
  next: "../1/",
  nextLabel: "Play River mode",
  learned: [["Water", "you spend it to flow"], ["Flow", "refills it every cycle"], ["Storage", "how much the jar holds"], ["Rock", "costs 2 gal"],
    ["Sand", "free, but −1 flow"], ["Spring", "+1 flow"], ["Mountain runoff", "+1 flow"], ["Grass", "free beside your river"],
    ["Meadow", "+1 storage per tree"], ["Trees", "grow from a meadow"], ["Grove", "+1 flow per 3 trees"]],
  objectives: [
    {text: "This is your water source. <b>Tap it.</b>", target: "source", lock: true, done: g => g.phase === "play"},
    {text: "<b>Tap a glowing tile</b> to flow there.", target: [[1, 3]], lock: true, move: true, needs: 1, done: g => g.on(1, 3), after: ["jar", "That cost 1 gal of water."]},
    {text: g => `Flow <b>2 more tiles</b> (${PATH.filter(([x, y]) => g.on(x, y)).length}/2)`, target: g => g.next(PATH), lock: true, move: true, needs: 1, done: g => PATH.every(([x, y]) => g.on(x, y))},
    {text: "Out of water. <b>Tap Next Water Cycle.</b>", target: "end", lock: true, done: g => g.turn >= 2, after: ["jar", g => `Your flow (+${g.income}) refills your water every cycle.`]},
    {text: "Rock costs 2 gal. <b>Go around it.</b>", target: [[4, 2], [4, 3]], allow: [[4, 2]], lock: true, move: true, needs: 1, done: g => g.on(4, 2)},
    {text: "Sand is free to cross. <b>Flow onto the sand.</b>", target: [[5, 2]], lock: true, move: true, done: g => g.on(5, 2), after: ["river", "…but it drinks 1 flow. Watch the river narrow."]},
    {text: "Reach the <b>spring</b> for +1 flow.", target: [[6, 2]], lock: true, move: true, done: g => g.on(6, 2), after: ["river", "+1 flow. Watch the river widen."]},
    {text: "<b>Flow beside the mountain's pool</b> for +1 flow.", sub: "Each mountain has one water side.", target: [[7, 2], [7, 1]], allow: [[7, 2], [6, 1]], lock: true, move: true, needs: 1, done: g => g.runoff >= 1, after: ["river", "+1 flow from the mountain."]},
    {text: "<b>Tap the glowing ground</b> to make grass. It's free.", sub: "Ground beside your river can turn green.", target: [[1, 4]], lock: true, done: g => g.g(1, 4) >= 1},
    {text: "<b>Grow the grass into a meadow</b> (1 gal).", sub: "Meadows hold water when trees are next to them.", target: [[1, 4]], lock: true, needs: 1, done: g => g.g(1, 4) >= 2},
    {text: "<b>Plant trees</b> next to your meadow.", sub: "Tap it: grass, then meadow, then trees.", target: [[2, 4]], lock: true, needs: g => g.g(2, 4) >= 1 ? 1 : 0, done: g => g.g(2, 4) >= 3, after: ["jar", "+1 storage: the tree shades your meadow."]},
    {text: g => `Three touching trees make a <b>grove</b>. <b>Plant 2 more</b> (${g.grown(GROVE, 3)}/2)`, sub: "A meadow you turn into trees gives up its storage.", target: g => { const q = GROVE.find(([x, y]) => g.g(x, y) < 3); return q ? [q] : [] }, lock: true,
      needs: g => { const q = GROVE.find(([x, y]) => g.g(x, y) < 3); return q && g.g(...q) >= 1 ? 1 : 0 }, done: g => g.groves >= 1, after: ["river", "+1 flow from your grove."]},
    {text: "<b>Tap Next Water Cycle</b> to fill your jar.", target: "end", lock: true, done: g => g.water >= g.cap},
    {text: g => `Your jar is full: next cycle <b>${g.spill} gal would spill</b>. <b>Spend 3 gal</b> on the glowing ground (${Math.min(3, g.cap - g.water)}/3)`, sub: "Spend it first, or it's lost.",
      target: g => { const q = ROW.find(([x, y]) => g.g(x, y) < 3); return q ? [q] : [] }, allow: ROW, lock: true, noCycle: true, done: g => g.cap - g.water >= 3, before: ["jar", "Water over storage spills."], after: ["jar", "Less spills now."]},
    {text: "Now <b>flow to the sea</b>.", target: [[8, 2]], move: true, done: g => g.won}
  ],
  help: [
    "This tutorial shows you one step at a time. Follow the card at the bottom: only the glowing tile or button works until you've done it.",
    "<b>Skip tutorial</b> (top right) takes you back to the home page. Your progress is kept, so you can come back to the same step."]
};
</script>
<script src="../play.js"></script>
</body>
</html>
