<body>
<script>
// Tutorial 6 · Pollinators: a grove already stands by the route. Grow a meadow next to it for bees: +1 flow.
window.MAP = {
  id: "map-9-pollinators",
  label: "Tutorial 6 · Pollinators",
  tutorial: 6,
  lesson: "<b>Pollinators.</b> Each <b>meadow</b> next to a grove brings bees: <b>+1 flow</b> per meadow.",
  types: [
    "___________~",
    "_ttt_______~",
    "S__________~",
    "___________~",
    "___________~"],
  elev: [
    "111111111110",
    "111111111110",
    "111111111110",
    "111111111110",
    "111111111110"],
  storage: 3,
  bloomKind: "bees",
  bloomLabel: "Bees",
  showBloom: true,
  bloomGoal: 1,
  turnGoal: 5,
  tileCost: 1,
  startHint: "Tap the spring on the left to start.",
  next: "../7/",
  // In-map objectives (LOU-264): one at a time, checked by the game
  objectives: [
    {text: "Tap the spring on the left to start", target: "source", done: g => g.phase !== "pick"},
    {text: "Run your stream beside the trees: a grove", target: "trees", done: g => g.groves >= 1},
    {text: "Plant grass touching the grove", target: "plantable", done: g => g.besideGrove >= 1 || g.bees >= 1},
    {text: "Grow it into a meadow: bees, +1 flow", target: "grass", done: g => g.bees >= 1},
    {text: "Reach the sea", target: "sea", done: g => g.won}],
  help: [
    "Tap the spring on the left. Its <b>flow</b> is <b>2 gal</b> per water cycle. Three trees already stand by the route.",
    "Run your stream beside the trees and they make a <b>grove</b>: <b>+1 flow</b>.",
    "<b>Pollinators:</b> grow a <b>meadow</b> (grass, then meadow) on ground that touches the grove: <b>+1 more flow</b> for each one.",
    "Keep your route beside the grove: a stream over a tree washes it away."]
};
</script>
<script src="../../play.js"></script>
