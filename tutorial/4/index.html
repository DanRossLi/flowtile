<body>
<script>
// Tutorial 4 · Trees: one tile of ground by the stream. Grass, meadow, then trees store enough for the lake.
window.MAP = {
  id: "tut-4-trees",
  label: "Tutorial 4 · Trees",
  tutorial: 4,
  lesson: "<b>Trees.</b> A meadow grows into <b>trees</b> for 1 more gal. Grass, meadow, trees: <b>+1 storage</b> each, so one tile can store <b>3 extra gal</b>.",
  types: [
    "BBBBBBBB~",
    "BBBBBBBB~",
    "T___LLL_~",
    "BBB_BBBB~",
    "BBBBBBBB~"],
  elev: [
    "111111110",
    "111111110",
    "111100010",
    "111111110",
    "111111110"],
  storage: 3,
  
  bloomGoal: 0,
  turnGoal: 5,
  tileCost: 1,
  startHint: "Tap the spring on the left to start.",
  next: "../5/",
  // In-map objectives (LOU-264): one at a time, checked by the game
  objectives: [
    {text: "Tap the spring on the left to start", target: "source", done: g => g.phase !== "pick"},
    {text: "Plant grass beside your river", target: "plantable", done: g => g.grass >= 1},
    {text: "Grow the grass into a meadow", target: "grass", done: g => g.meadows >= 1},
    {text: "Grow the meadow into trees", target: "meadow", done: g => g.trees >= 1},
    {text: "Store 6 gal and fill the lake", target: "lake", done: g => g.lakes >= 1},
    {text: "Reach the sea", target: "sea", done: g => g.won}],
  help: [
    "Tap the spring on the left. Its <b>flow</b> is <b>3 gal</b> per water cycle, and you can <b>store 3 gal</b>.",
    "The <b>lake</b> costs <b>6 gal</b>, and there is only <b>one</b> tile of ground beside the stream.",
    "Grow it all the way: <b>grass</b>, then <b>meadow</b>, then <b>trees</b>, 1 gal each, <b>+1 storage</b> each.",
    "If the stream runs over trees it washes them away, and you lose all 3 storage."]
};
</script>
<script src="../../play.js"></script>
</body>
</html>
