<body>
<script>
// Custom map: plays a map shared as a code (the part after # in the link). With no code, asks for one.
(function () {
  const raw = decodeURIComponent((location.hash || "").slice(1)).trim().replace(/^.*#/, "");
  let map = null;
  try { const bin = atob(raw.replace(/-/g, "+").replace(/_/g, "/")), bytes = Uint8Array.from(bin, c => c.charCodeAt(0)); map = JSON.parse(new TextDecoder().decode(bytes)) } catch (_) {}
  const ok = map && Array.isArray(map.types) && map.types.length && map.types.every(r => typeof r === "string" && r.length === map.types[0].length) && map.types.length <= 30 && map.types[0].length <= 30;
  if (ok) {
    map.elev ||= map.types.map(r => [...r].map(c => "~L".includes(c) ? "0" : "1").join(""));
    map.id = "custom-" + (map.id || "map"); map.label = "Custom · " + String(map.label || "Map").replace(/<[^>]*>/g, "").slice(0, 40);
    map.next = null; map.placeSource = true; map.startHint = "Tap a source to start."; map.help = ["A map someone shared with you as a code."]; map.lesson = "A map someone shared with you. Reach the sea and see what you can grow."; map.turnGoal ||= 10;
    if (map.gen && typeof map.gen === "object") { // made by the map generator: its own goal card and a New island button
      const esc = s => String(s || "").replace(/[&<>"']/g, ch => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"})[ch]).slice(0, 40);
      const biome = {meadow:"meadow", desert:"desert", alpine:"alpine", rain:"rainforest"}[map.gen.biome] || "", size = {small:"small", medium:"medium", large:"large"}[map.gen.size] || "";
      map.label = "Generated · " + esc(map.gen.seed);
      map.lesson = `A ${[size, biome].filter(Boolean).join(" ")} island from the map generator, seed <b>${esc(map.gen.seed)}</b>. ${map.mode === "perfection" ? "Score as many points as you can." : "Reach the sea and see what you can grow."}`;
      map.help = ["Made by the map generator. The same seed and options always give the same island, so you can share it with <b>Copy map code</b>.", "<b>New island</b> on the win card makes another one with the same options."];
      map.next = "../generator/?again"; map.nextLabel = "New island"; map.startHint = "Tap a source to start, or tap a glowing land tile to place your own." }
    window.MAP = map;
  } else {
    window.MAP = null;
    document.body.innerHTML = `<dialog open style="position:static;margin:40px auto"><h2>Open a map code</h2>
      <p>${raw ? "That code didn't work. " : ""}Paste a map code or a map link. You get one from <b>Help</b> → <b>Copy map code</b> on any island.</p>
      <form id="f"><textarea id="code" rows="4" style="width:100%;font:inherit;border-radius:12px;padding:8px" placeholder="Paste the code or link here"></textarea>
      <button class="end" style="width:100%;margin-top:10px">Play this map</button></form>
      <p style="margin-top:14px"><a href="../world/">Back to the islands</a></p></dialog>`;
    document.getElementById("f").onsubmit = e => { e.preventDefault(); const v = document.getElementById("code").value.trim(); location.hash = v.includes("#") ? v.slice(v.indexOf("#") + 1) : v; location.reload() };
  }
})();
if (window.MAP) document.write('<script src="../play.js"><\/script>');
</script>
</body>
</html>
