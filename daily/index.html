<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow Tile · Daily island</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flow Tile">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#13222e">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700&display=swap">
<link rel="stylesheet" href="../play.css">
</head>
<body>
<script>
// Daily island: a new generated island every day, the same for everyone (seeded by the date). Perfection scoring, every rule on.
// Add ?d=YYYY-MM-DD to play another day's island.
(function () {
  const q = typeof location !== "undefined" ? new URLSearchParams(location.search).get("d") : null, d = new Date();
  const day = /^\d{4}-\d{2}-\d{2}$/.test(q || "") ? q : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  let h = 1779033703; for (const ch of day) h = Math.imul(h ^ ch.charCodeAt(0), 3432918353);
  const rand = () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296 };
  const ri = (a, b) => a + Math.floor(rand() * (b - a + 1));
  const W = 13, H = 7, g = Array.from({length:H}, () => Array(W).fill("_"));
  for (let y = 0; y < H; y++) g[y][W - 1] = "~";
  const free = (x, y) => x > 0 && x < W - 1 && y >= 0 && y < H && g[y][x] === "_";
  const put = (ch, n, w = 1, hh = 1) => { for (let i = 0, k = 0; i < n && k < 300; k++) { const x = ri(2, W - 1 - w), y = ri(0, H - hh); let ok = true;
    for (let dy = 0; dy < hh; dy++) for (let dx = 0; dx < w; dx++) if (!free(x + dx, y + dy)) ok = false;
    if (!ok) continue; for (let dy = 0; dy < hh; dy++) for (let dx = 0; dx < w; dx++) g[y + dy][x + dx] = ch; i++ } };
  const sy = ri(1, H - 2); g[sy][0] = "T"; const sy2 = ri(0, H - 1); if (Math.abs(sy2 - sy) > 1) g[sy2][0] = "S";
  put("L", 1, 2, 2); put("F", 1, 3, 2); put("B", ri(1, 3)); put("r", ri(2, 4)); put("s", ri(1, 3)); put(".", ri(3, 6)); put("p", ri(1, 3)); put("v", ri(0, 2)); put("o", ri(0, 1));
  for (let x = 1; x < W - 1; x++) if (g[sy][x] === "B") g[sy][x] = "_"; // always a way to the sea from the main source
  const wind = [[-1, 0], [0, -1], [0, 1]][ri(0, 2)], kinds = ["rain", "drought", "fire", "rain"], weather = {}, ts = new Set();
  while (ts.size < 3) ts.add(ri(3, 18)); for (const t of ts) weather[t] = kinds[ri(0, 3)];
  const types = g.map(r => r.join("")), elev = types.map(r => [...r].map(c => "~L".includes(c) ? "0" : "1").join(""));
  const say = {rain:"rain", drought:"a drought", fire:"lightning"};
  window.MAP = {id:"daily-" + day, label:"Daily island · " + day.slice(5), lesson:"A new island every day, the same for everyone. Every rule is on: score as many points as you can.", mode:"perfection", turns:20, scoreStars:[30, 45, 60], share:true,
    types, elev, storage:3, wind, cycle:true, weather, spread:true, floodplain:true, snowmelt:true, moss:true, deer:true,
    tileCost:1, showBloom:true, next:null,
    startHint:"A new island every day, the same for everyone. Tap a source on the left to start.", pickHint:"Tap a source on the left.",
    help:["A new island every day, the same for everyone. Every rule from the lessons is on.",
      "Forecast: " + Object.entries(weather).sort((a, b) => a[0] - b[0]).map(([t, k]) => `${say[k]} on turn ${t}`).join(", ") + ".",
      "When you're done, tap <b>Share score</b> to send your result."]};
})();
</script>
<script src="../play.js"></script>
</body>
</html>
