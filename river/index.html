<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow Tile · Single player</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flow Tile">
<meta name="theme-color" content="#13222e">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Patrick+Hand&family=Nunito:wght@500;700;800&display=swap">
<style>
  :root{--sea:#2b68b0;--deep:#1f4f8c;--paper:#f4f1e8;--ink:#13222e;--gold:#ffd166;--gold-d:#d9a93c;--green:#7cc94c;--muted:#6c7b83;--blue:#2f9be8;--blue-d:#1d6aa6}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;background:radial-gradient(120% 80% at 50% 0%,#3a7cc4 0%,var(--sea) 45%,var(--deep) 100%);color:#fff;font-family:Nunito,system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
  h1{font-family:Fredoka,Nunito,sans-serif;font-size:30px;margin:6px 0 2px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
  h1 span{color:#8fdcff}
  .sub{margin:0 0 14px;opacity:.9;font-weight:700}
  .bar{height:12px;border-radius:999px;background:rgba(0,0,0,.22);overflow:hidden;margin:0 0 6px}
  .bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:999px;transition:width .6s cubic-bezier(.3,1.2,.5,1)}
  .count{font-weight:800;font-size:13px;opacity:.85;margin:0 0 14px}
  a.go{display:block;text-align:center;text-decoration:none;font-family:Fredoka,Nunito,sans-serif;font-weight:700;font-size:19px;color:#fff;background:var(--blue);border-radius:16px;padding:14px;box-shadow:0 5px 0 var(--blue-d);margin:0 0 18px}
  a.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-d)}
  a.go small{display:block;font-family:Nunito,sans-serif;font-size:13px;font-weight:800;opacity:.9}
  ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  ol a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--paper);border-radius:16px;padding:10px 12px;box-shadow:0 4px 0 #b9b19c}
  ol a:active{transform:translateY(3px);box-shadow:0 1px 0 #b9b19c}
  ol a:focus-visible,a.go:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .n{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#e2ddd0;font-family:Fredoka,Nunito,sans-serif;font-weight:700;font-size:16px;color:#4c5c65;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
  .done .n{background:var(--green);color:#fff}
  .next{box-shadow:0 4px 0 #b9b19c,0 0 0 3px var(--gold) !important}
  .t{flex:1;min-width:0}
  .t b{display:block;font-family:Fredoka,Nunito,sans-serif;font-size:17px;line-height:1.15}
  .t small{display:block;color:var(--muted);font-weight:700;font-size:13px;line-height:1.3}
  .tick{flex:none;width:22px;height:22px}
  .tick path{fill:none;stroke:#3f8a4a;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
  .st{flex:none;display:flex;gap:1px}.st svg{width:17px;height:17px;fill:#d9d3c4;stroke:#b9b19c;stroke-width:1.2;stroke-linejoin:round}.st svg.on{fill:var(--gold);stroke:var(--gold-d)}
  .skip{flex:none;font-style:normal;font-weight:800;font-size:12px;color:var(--muted)}
  h2.chap{font-family:Fredoka,Nunito,sans-serif;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:18px 0 8px;opacity:.85}
  ol a.locked{opacity:.55;cursor:default;box-shadow:0 2px 0 #b9b19c}
  .lk{flex:none;width:20px;height:20px;fill:none;stroke:#8a8f93;stroke-width:2;stroke-linejoin:round}
  footer{margin-top:22px;font-size:13px;opacity:.85}
  footer a{color:#fff}
  @media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
<link rel="stylesheet" href="../paper.css">
</head>
<body>
<main>
  <h1>Single <span>player</span></h1>
  <p class="sub">20 islands, each bigger and harder than the last. Reach the sea to open the next one.</p>
  <div class="bar" aria-hidden="true"><i id="fill"></i></div>
  <p class="count" id="count"></p>
  <a class="go" id="go" href="../level/1/"></a>
  <div id="list"></div>
  <footer>New to Flow Tile? Start with the <a href="../tutorial/">Tutorial</a>. Or go <a href="../">home</a>.</footer>
</main>
<script src="../levels.js"></script>
<script>
// Single player campaign (Dan, Nov 12): 20 brand-new levels in chapters, growing to a 40×40 finale.
// A level opens once the one before it reached the sea; stars are for replaying.
const STAR = on => `<svg class="${on ? "on" : ""}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>`;
const LOCK = `<svg class="lk" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>`;
const got = LEVELS.map(l => levelStars(l[0])), done = got.filter(s => s > 0).length, first = got.findIndex(s => !s);
let html = "", ch = -1;
for (const [n, name, what, size, c] of LEVELS) {
  if (c !== ch) { if (ch >= 0) html += "</ol>"; ch = c; html += `<h2 class="chap">${CHAPTERS[c]}</h2><ol>` }
  const st = got[n - 1], open = levelOpen(n);
  html += `<li><a class="${st ? "done" : ""}${n - 1 === first ? " next" : ""}${open ? "" : " locked"}" href="../level/${n}/" ${open ? "" : 'aria-disabled="true" tabindex="-1"'} aria-label="Level ${n}, ${name}: ${what}. ${open ? `${st} of 3 stars` : "Locked"}"><span class="n">${n}</span><span class="t"><b>${name}</b><small>${what} · ${size}</small></span>${open ? `<span class="st">${[0, 1, 2].map(k => STAR(k < st)).join("")}</span>` : LOCK}</a></li>`;
}
document.getElementById("list").innerHTML = html + "</ol>";
document.getElementById("list").addEventListener("click", e => { if (e.target.closest("a.locked")) e.preventDefault() });
document.getElementById("count").textContent = `${done} of ${LEVELS.length} reached the sea · ${got.reduce((a, b) => a + b, 0)} of ${LEVELS.length * 3} stars`;
document.getElementById("fill").style.width = (done / LEVELS.length * 100) + "%";
const go = document.getElementById("go");
if (first < 0) { const low = got.findIndex(s => s < 3); go.href = low < 0 ? "../daily/" : `../level/${low + 1}/`; go.innerHTML = low < 0 ? "Every star found! Play the Daily island<small>A new island every day</small>" : `Find more stars<small>Level ${low + 1} · ${LEVELS[low][1]}</small>` }
else { go.href = `../level/${first + 1}/`; go.innerHTML = `${done ? "Continue" : "Start"}<small>Level ${first + 1} · ${LEVELS[first][1]}: ${LEVELS[first][2]}</small>` }
</script>
</body>
</html>
