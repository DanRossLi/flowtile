<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow Tile · Levels</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flow Tile">
<meta name="theme-color" content="#cfe3ea">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Levels (LOU-290, design board 3): four chapters of six, a star count for each and for the whole campaign */
  *{box-sizing:border-box}
  html{background:#eef4f2}
  body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#cfe3ea,#eef4f2) fixed;color:#24434a;font-family:'M PLUS Rounded 1c',Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  main{max-width:430px;margin:0 auto;padding:0 0 calc(28px + env(safe-area-inset-bottom,0px))}
  .top{display:flex;align-items:center;gap:8px;padding:max(16px,env(safe-area-inset-top)) 16px 4px}
  .back{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 8px 24px rgba(30,60,60,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .back svg{width:20px;height:20px;fill:none;stroke:#24434a;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  h1{flex:1;margin:0;font-size:22px;font-weight:800}
  .total{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.88);box-shadow:0 8px 24px rgba(30,60,60,.16);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:800;white-space:nowrap}
  .total svg{width:16px;height:16px}
  .list{padding:0 16px}
  .chap{display:flex;justify-content:space-between;align-items:baseline;margin:14px 4px 8px;font-size:12.5px;font-weight:800;color:#4f6f70}
  .chap h2{margin:0;font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .chap span{display:flex;align-items:center;gap:4px;white-space:nowrap}
  .chap svg{width:13px;height:13px}
  a.row{display:flex;align-items:center;gap:11px;min-height:50px;margin-bottom:7px;padding:8px 12px 8px 9px;border-radius:16px;background:rgba(255,255,255,.88);color:#24434a;text-decoration:none}
  a.row:active{transform:scale(.985)}
  a.row:focus-visible,.back:focus-visible{outline:3px solid #2f7fb8;outline-offset:2px}
  .num{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#eef5f6;font-size:15px;font-weight:800}
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .txt small{display:block;font-size:12px;font-weight:500;color:#4f6f70;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .st{flex:none;display:flex;gap:1px}.st svg{width:15px;height:15px}
  a.row.now{background:#fff;outline:2.5px solid #ffd98a;box-shadow:0 6px 16px rgba(30,60,60,.14)}
  a.row.now .num{background:linear-gradient(180deg,#9fd7c9,#5fae9c);color:#0f3a33}
  .play{flex:none;display:flex;align-items:center;height:34px;padding:0 16px;border-radius:999px;background:linear-gradient(180deg,#9fd7c9,#5fae9c);box-shadow:0 3px 0 #3f8a7a;font-size:14px;font-weight:800;color:#0f3a33}
  a.row.locked{background:rgba(255,255,255,.5);cursor:default}
  a.row.locked:active{transform:none}
  a.row.locked .num{background:#e6eeef;color:#8fa0a3}
  a.row.locked b{color:#8fa0a3}a.row.locked small{color:#9fb0b2}
  .lk{flex:none;width:16px;height:16px;fill:none;stroke:#a9b8ba;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  footer{margin:16px 20px 0;font-size:13px;font-weight:700;color:#4f6f70}
  footer a{color:#2f6f9e}
</style>
</head>
<body>
<main>
  <div class="top">
    <a class="back" href="../" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg></a>
    <h1>Levels</h1>
    <div class="total" id="total" aria-label="Stars"></div>
  </div>
  <div class="list" id="list"></div>
  <footer>More to play: <a href="../world/#extra">Extra islands</a> and <a href="../world/">all islands</a>.</footer>
</main>
<script src="../levels.js"></script>
<script>
// Levels (LOU-290): 24 levels in four chapters of six. Reaching the sea always opens the next level; stars are for replaying.
const P = "M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z";
const STAR = on => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${P}" ${on ? 'fill="#f2b632" stroke="#d99a1c" stroke-width="1.2"' : 'fill="none" stroke="#c3cfd1" stroke-width="2"'} stroke-linejoin="round"/></svg>`;
const LOCK = `<svg class="lk" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>`;
const got = LEVELS.map(l => levelStars(l[0])), sum = a => a.reduce((x, y) => x + y, 0);
let now = LEVELS.findIndex((l, i) => levelOpen(l[0]) && !got[i]); // the level to play next: the first open one without a star
if (now < 0) now = got.findIndex(s => s < 3);
let html = "";
CHAPTERS.forEach((name, c) => { const rows = LEVELS.filter(l => l[4] === c);
  html += `<div class="chap"><h2>Chapter ${c + 1} · ${name}</h2><span aria-label="${sum(rows.map(l => got[l[0] - 1]))} of ${rows.length * 3} stars">${STAR(true)}${sum(rows.map(l => got[l[0] - 1]))} / ${rows.length * 3}</span></div>`;
  for (const [n, title, what] of rows) { const st = got[n - 1], open = levelOpen(n), cur = n - 1 === now;
    const note = open ? what : levelOpen(n - 1) ? `Reach the sea on Level ${n - 1}` : /^New: /.test(what) ? what : `Opens after Level ${n - 1}`;
    html += `<a class="row${cur ? " now" : ""}${open ? "" : " locked"}" href="../level/${n}/" ${open ? "" : 'aria-disabled="true" tabindex="-1"'} aria-label="Level ${n}, ${title}. ${open ? `${what}. ${st} of 3 stars` : "Locked. " + note}"><span class="num">${n}</span><span class="txt"><b>${title}</b><small>${note}</small></span>${!open ? LOCK : cur && !st ? '<span class="play">Play</span>' : `<span class="st">${[0, 1, 2].map(k => STAR(k < st)).join("")}</span>`}</a>` } });
document.getElementById("list").innerHTML = html;
document.getElementById("total").innerHTML = `${STAR(true)}${sum(got)} / ${LEVELS.length * 3}`;
document.getElementById("list").addEventListener("click", e => { if (e.target.closest("a.locked")) e.preventDefault() });
const cur = document.querySelector("a.row.now"); if (cur && cur.getBoundingClientRect().bottom > innerHeight) cur.scrollIntoView({block:"center"});
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(() => {}));
</script>
</body>
</html>
