<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow Tile · Settings</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flow Tile">
<meta name="theme-color" content="#cfe3ea">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Settings (LOU-288, LOU-293): a short list of switches. Each is saved on this device as soon as it's changed. */
  *{box-sizing:border-box}
  html{background:#eef4f2}
  body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#cfe3ea,#eef4f2) fixed;color:#24434a;font-family:'M PLUS Rounded 1c',Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  main{max-width:430px;margin:0 auto;padding:0 0 calc(28px + env(safe-area-inset-bottom,0px))}
  .top{display:flex;align-items:center;gap:8px;padding:max(16px,env(safe-area-inset-top)) 16px 10px}
  .back{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 8px 24px rgba(30,60,60,.16)}
  .back svg{width:20px;height:20px;fill:none;stroke:#24434a;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  h1{flex:1;margin:0;font-size:22px;font-weight:800}
  .list{margin:6px 16px 0;border-radius:22px;background:rgba(255,255,255,.88);box-shadow:0 8px 24px rgba(30,60,60,.16);padding:4px 16px}
  label.row,.row{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid rgba(36,67,74,.08);cursor:pointer}
  .row:first-child{border-top:0}
  .ico{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#eef5f6}
  .ico svg{width:20px;height:20px;fill:none;stroke:#24434a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .row span{flex:1;min-width:0}
  .row b{display:block;font-size:16px;font-weight:800}
  .row small{display:block;font-size:12.5px;font-weight:500;color:#4f6f70;line-height:1.3}
  .row input{position:absolute;opacity:0;width:1px;height:1px}
  .sw{flex:none;position:relative;width:50px;height:30px;border-radius:999px;background:#cfdcde;transition:background .15s}
  .sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(30,60,60,.3);transition:transform .15s}
  input:checked+.sw{background:#5fae9c}input:checked+.sw::after{transform:translateX(20px)}
  input:focus-visible+.sw{outline:3px solid #2f7fb8;outline-offset:2px}
  .note{margin:14px 22px 0;font-size:12.5px;color:#4f6f70}
  @media (prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <a class="back" href="../" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg></a>
    <h1>Settings</h1>
  </div>
  <div class="list" id="list"></div>
  <p class="note">Settings are saved on this device.</p>
</main>
<script>
// Each switch: [storage key, value when on, value when off (null removes the key), on by default?, title, note, icon path]
const ROWS = [
  ["flowtile.guidance", null, "off", true, "Guidance", "Short guided steps the first time a level shows something new", '<path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="4"/>'],
  ["flowtile.hard", "1", "0", false, "Hard mode", "3 undos per level", '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.3 6L12 16.400 6.600 19.400l1.300-6L3.400 9.300l6-.7z"/>'],
];
const get = k => { try { return localStorage.getItem(k) } catch (_) { return null } };
const isOn = ([k, on, off, def]) => { const v = get(k); return v === null ? def : on === null ? v !== off : v === on };
document.getElementById("list").innerHTML = ROWS.map((r, i) => `<label class="row"><i class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">${r[6]}</svg></i><span><b>${r[4]}</b><small>${r[5]}</small></span><input type="checkbox" data-i="${i}"${isOn(r) ? " checked" : ""}><i class="sw" aria-hidden="true"></i></label>`).join("");
document.getElementById("list").addEventListener("change", e => { const r = ROWS[+e.target.dataset.i]; if (!r) return; const v = e.target.checked ? r[1] : r[2];
  try { if (v === null) localStorage.removeItem(r[0]); else localStorage.setItem(r[0], v) } catch (_) {}
  document.dispatchEvent(new CustomEvent("flowtile-setting", {detail:{key:r[0], on:e.target.checked}})) });
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("../sw.js").catch(() => {}));
</script>
</body>
</html>
