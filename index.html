<script>
// Spring Hill: the original v0.1 test map, with the full rules (downhill 1 gal, flat 2 gal, waterfalls give speed).
// Map key: . meadow  s sand  r rock  B boulder  o spring  L lake  ~ sea  S source (2 gal/turn)  T source (3 gal/turn)
window.MAP = {
  id: "spring-hill",
  label: "Test map · Spring Hill",
  types: [
    "BS...TB",
    ".s..r.B",
    "..o.s.s",
    "s.LL.r.",
    ".sLL.s.",
    "B.s.sBo",
    ".s.r..s",
    "s..s.s.",
    "~~~~~~~"],
  elev: [
    "8776679",
    "7665566",
    "6554455",
    "5422443",
    "4322333",
    "3233322",
    "2221211",
    "1111111",
    "0000000"],
  bloomGoal: 10,
  turnGoal: 6,
  lakeTileCost: 2,
  showSpeed: true,
  startHint: "Tap a spring at the top to choose your source.",
  pickHint: "Tap one of the two springs at the top.",
  next: null,
  help: [
    "Pick a source. The left one has a flow of <b>2 gal</b> a turn, the right one <b>3 gal</b>.",
    "Tap a glowing tile to extend the river. The number is its cost in gallons. Out of water? <b>End turn</b> and your flow refills it.",

    "<b>Sand</b> costs +1 gal but blooms every land tile around it.",
