<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow Tile</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flow Tile">
<meta name="theme-color" content="#cfe3ea">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Home (LOU-288, design boards 1 and 2): one main action (Play, Continue or Resume), then "More ways to play". */
  *{box-sizing:border-box}
  html{background:#eef4f2}
  body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#cfe3ea,#eef4f2) fixed;color:#24434a;font-family:'M PLUS Rounded 1c',Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  main{max-width:430px;margin:0 auto;padding:0 0 calc(18px + env(safe-area-inset-bottom,0px))}
  a{color:inherit;text-decoration:none}
  .glass{background:rgba(255,255,255,.88);box-shadow:0 8px 24px rgba(30,60,60,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  header{display:flex;align-items:center;gap:10px;padding:max(18px,env(safe-area-inset-top)) 18px 12px}
  .logo{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(180deg,#7fc3e0,#3f86b0);box-shadow:0 4px 10px rgba(63,134,176,.35)}
  .logo svg{width:18px;height:22px}
  header div{flex:1;min-width:0}
  h1{margin:0;font-size:22px;font-weight:800;line-height:1.1}
  header p{margin:0;font-size:12.5px;color:#4f6f70}
  .gear{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%}
  .gear svg{width:20px;height:20px;fill:none;stroke:#24434a;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .pad{padding:0 18px}
  /* the picture: the game itself, drawing the island (level/N/?poster) */
  .pic{position:relative;display:block;height:300px;border-radius:28px;overflow:hidden;box-shadow:0 10px 28px rgba(30,60,60,.2);background:linear-gradient(180deg,#dfeaec,#bcd6dd)}
  .pic iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
  .pic .tag{position:absolute;left:12px;top:12px;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800}
  .mint{display:flex;align-items:center;justify-content:center;border-radius:999px;background:linear-gradient(180deg,#9fd7c9,#5fae9c);color:#0f3a33;font-weight:800;text-align:center}
  .mint:active{transform:translateY(3px)}
  .play{height:68px;margin-top:18px;box-shadow:0 6px 0 #3f8a7a,0 12px 24px rgba(0,0,0,.16);font-size:24px}
  .play:active{box-shadow:0 3px 0 #3f8a7a,0 6px 12px rgba(0,0,0,.16)}
  .learn{margin:14px 0 0;text-align:center;font-size:14px;color:#4f6f70}
  .played{display:block;margin:6px auto 22px;padding:4px 8px;border:0;background:none;font:800 13.5px 'M PLUS Rounded 1c',Nunito,system-ui,sans-serif;color:#3f86b0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  /* returning: one glass card */
  .card{border-radius:28px;padding:8px 8px 16px}
  .card .pic{height:190px;border-radius:22px}
  .cbody{padding:12px 10px 0}
  .caps{font-size:12px;font-weight:800;color:#3f86b0;text-transform:uppercase}
  .cname{font-size:22px;font-weight:800;line-height:1.15}
  .cnote{font-size:13.5px;color:#4f6f70}
  .go{height:60px;margin-top:12px;box-shadow:0 5px 0 #3f8a7a,0 10px 20px rgba(0,0,0,.14);font-size:20px}
  .go:active{box-shadow:0 2px 0 #3f8a7a,0 6px 12px rgba(0,0,0,.14)}
  .prog{display:flex;align-items:center;gap:8px;margin-top:16px}
  .prog svg{flex:none;width:18px;height:18px}
  .prog b{font-size:14px;font-weight:800}.prog span{font-size:13px;color:#4f6f70;white-space:nowrap}
  .prog i{flex:1;height:7px;border-radius:4px;background:#dfe9ea;overflow:hidden}
  .prog i u{display:block;height:100%;border-radius:4px;background:#f2b632}
  .prog em{font-style:normal;font-size:12px;font-weight:700;color:#4f6f70;white-space:nowrap}
  .links{display:flex;justify-content:center;gap:26px;margin:14px 0 20px;font-size:14px;font-weight:800;color:#3f86b0}
  .links a{display:flex;align-items:center;gap:5px;padding:4px 2px}
  .links svg{width:16px;height:16px;fill:none;stroke:#3f86b0;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  /* more ways to play */
  h2{margin:0 2px 8px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#4f6f70}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .tile{display:flex;align-items:center;gap:10px;min-height:56px;border-radius:18px;padding:10px 12px}
  .tile:active{transform:scale(.98)}
  .ico{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:11px}
  .ico svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .tile span{min-width:0}
  .tile b{display:block;font-size:14px;font-weight:800;white-space:nowrap}
  .tile small{display:block;font-size:11.5px;font-weight:500;color:#4f6f70;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .all{display:block;margin:10px auto 0;padding:6px;text-align:center;font-size:13px;font-weight:800;color:#3f86b0}
  a:focus-visible,button:focus-visible{outline:3px solid #2f7fb8;outline-offset:3px}
  @media (max-height:780px){.pic{height:240px}.card .pic{height:150px}.played{margin-bottom:14px}.links{margin-bottom:14px}}
  @media (max-height:680px){.pic{height:180px}.card .pic{height:120px}.play{height:60px}}
</style>
</head>
<body>
<main>
  <header>
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 12 15"><path d="M6 1C6 1 1 7 1 10a5 5 0 0010 0C11 7 6 1 6 1z" fill="#fff"/></svg></span>
    <div><h1>Flow Tile</h1><p>Grow a river from its source to the sea</p></div>
    <a class="gear glass" href="settings/" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></a>
  </header>
  <div class="pad" id="hero"></div>
  <div class="pad">
    <h2>More ways to play</h2>
    <div class="grid">
      <a class="tile glass" href="daily/"><i class="ico" style="background:#e0a43a"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></i><span><b>Daily island</b><small id="tDaily">New every day</small></span></a>
      <a class="tile glass" href="generator/"><i class="ico" style="background:#5fae9c"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></i><span><b>Custom island</b><small>Make your own</small></span></a>
      <a class="tile glass" href="perfection/"><i class="ico" style="background:#f3e6ff"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z" style="fill:#f2b632;stroke:#d99a1c;stroke-width:1.2"/></svg></i><span><b>Perfection</b><small id="tPerf">Score in 20 turns</small></span></a>
      <a class="tile glass" href="big/"><i class="ico" style="background:#3f86b0"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg></i><span><b>Big map</b><small>A long game</small></span></a>
    </div>
    <a class="all" href="world/">All islands</a>
  </div>
</main>
<script src="levels.js"></script>
<script>
// Home (LOU-288). One main action at the top:
//   first visit       Play (Level 1, guided), "Learn by doing · about 3 minutes", and "I've played before"
//   a run in progress Resume · Level N, turn T
//   returning         Continue · the next level that hasn't reached the sea
//   campaign complete Play today's Daily island
// The picture is the game itself drawing that level's island (level/N/?poster).
const get = k => { try { return localStorage.getItem(k) } catch (_) { return null } }, num = k => +get(k) || 0;
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z" fill="#f2b632" stroke="#d99a1c" stroke-width="1.2" stroke-linejoin="round"/></svg>';
const d = new Date(), day = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`, daily = num("flowtile.best.daily-" + day);
// a campaign run in progress: the newest saved run that is under way and less than 12 hours old (older ones start fresh)
function resume() { let best = null; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i), m = /^flowtile\.run\.v\d+\.c2-(\d+)$/.exec(k || ""); if (!m) continue;
      const r = JSON.parse(localStorage.getItem(k)); if (!r || !r.S || r.S.phase !== "play" || !r.at || Date.now() - r.at > 12 * 3600e3) continue; if (!best || r.at > best.at) best = {n:+m[1], turn:r.S.turn, at:r.at} } } catch (_) {}
  return best && LEVELS[best.n - 1] ? best : null }
function render() { const got = LEVELS.map(l => levelStars(l[0])), done = got.filter(s => s > 0).length, total = got.reduce((a, b) => a + b, 0), max = LEVELS.length * 3, run = resume();
  const next = !done && playedBefore() ? 3 : LEVELS.findIndex((l, i) => levelOpen(l[0]) && !got[i]), hero = document.getElementById("hero"); // "I've played before" starts at Level 4
  if (!done && !run && !playedBefore()) { // first visit
    hero.innerHTML = `<a class="pic" href="level/1/" aria-label="Play Level 1"><iframe src="level/1/?poster" title="" tabindex="-1" aria-hidden="true" scrolling="no"></iframe></a>
      <a class="mint play" href="level/1/">Play</a><p class="learn">Learn by doing · about 3 minutes</p><button type="button" class="played" id="played">I've played before</button>`;
    document.getElementById("played").onclick = () => { try { localStorage.setItem("flowtile.guidance", "off") } catch (_) {} render() }; return }
  let caps, name, note, btn, href, pic, tag;
  if (run) { const l = LEVELS[run.n - 1]; caps = "Resume"; name = `Level ${l[0]} · ${l[1]}`; note = `Turn ${run.turn}`; btn = "Resume"; href = pic = `level/${l[0]}/`; tag = `Chapter ${l[4] + 1} · ${CHAPTERS[l[4]]}` }
  else if (next >= 0) { const l = LEVELS[next]; caps = done ? "Continue" : "Start here"; name = `Level ${l[0]} · ${l[1]}`; note = l[2]; btn = done ? "Continue" : "Play"; href = pic = `level/${l[0]}/`; tag = `Chapter ${l[4] + 1} · ${CHAPTERS[l[4]]}` }
  else { caps = "Campaign complete"; name = "Today's Daily island"; note = daily ? `Played today · ${daily}` : "A new island every day, the same for everyone"; btn = "Play today's Daily island"; href = pic = "daily/"; tag = "Daily island" }
  hero.innerHTML = `<div class="card glass"><a class="pic" href="${href}" tabindex="-1" aria-hidden="true"><iframe src="${pic}?poster" title="" tabindex="-1" aria-hidden="true" scrolling="no"></iframe><span class="tag glass">${tag}</span></a>
      <div class="cbody"><div class="caps">${caps}</div><div class="cname">${name}</div><div class="cnote">${note}</div>
        <a class="mint go" href="${href}">${btn}</a>
        <div class="prog" aria-label="${total} of ${max} stars, ${done} of ${LEVELS.length} levels">${STAR}<b>${total}</b><span>of ${max} stars</span><i><u style="width:${total / max * 100}%"></u></i><em>${done} / ${LEVELS.length}</em></div>
      </div></div>
    <div class="links"><a href="river/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>All levels</a>
      <a href="settings/"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Settings</a></div>` }
render();
// more ways to play: one status line each
const pb = num("flowtile.best.perfection-island");
document.getElementById("tDaily").textContent = daily ? `Played today · ${daily}` : LEVELS.some(l => levelStars(l[0])) ? "Not played today" : "New every day";
document.getElementById("tPerf").textContent = pb ? `Best ${pb}` : "Score in 20 turns";
addEventListener("pageshow", e => { if (e.persisted) render() }); // coming back from a level: show where you are now
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
